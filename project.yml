name: StudyDock
options:
  bundleIdPrefix: com.edwardlink
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
targets:
  StudyDockCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources: [Sources/StudyDockCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardlink.StudyDockCore
        GENERATE_INFOPLIST_FILE: YES
  StudyDock:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources/StudyDockApp, Resources]
    dependencies:
      - target: StudyDockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardlink.StudyDock
        PRODUCT_NAME: StudyDock
        INFOPLIST_FILE: Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Configuration/StudyDock.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StudyDockTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests/StudyDockCoreTests]
    dependencies:
      - target: StudyDockCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StudyDock:
    build:
      targets:
        StudyDock: all
        StudyDockTests: [test]
    test:
      targets: [StudyDockTests]
